<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="./assets/js/toast.js"></script>
<script>
	// Dear God, send help.

    function createBackgroundVideo(){
        if (document.getElementById("background-video")) {
            return;
        }

        const video  = document.createElement('video');
        video.id = "background-video";
        video.loop = true;

        const source = document.createElement('source');
        source.src  = './assets/media/videos/patagonia.webm';
        source.type = "video/mp4";
		
        video.classList.add('hide');
        video.append(source);
        
		document.body.append(video);
        return video;
    }

    function initializeApp(){
        const backgroundVideo = createBackgroundVideo();
        const welcomeMessage  = document.getElementById('welcome-message');
        const mainMenu        = document.getElementById('main-menu');

        welcomeMessage.classList.add('hide');
        
        welcomeMessage.addEventListener('transitionend', () => {
            welcomeMessage.remove();
            
            backgroundVideo.play();
            backgroundVideo.classList.remove('hide');
            
            mainMenu.classList.remove('hide');

            gsap.from(mainMenu, {
                y: window.innerHeight + 200,
                duration: 1.2,
                ease: "circ.out"
            });

        }, { once: true });

    }

	document.querySelectorAll('[data-copy]').forEach((parent) => {
		parent.addEventListener('click', async (e) => {
			const copy = parent.getAttribute('data-copy');

			try {
				await navigator.clipboard.writeText(copy);
				alert(`Copied ${copy}`);
			} catch (err) {
				alert(err);
			}
		});
	});

    window.alert = (msg) => toast.create({ text: msg, position: 'top-right'});
    document.addEventListener('pointerdown', initializeApp, { once: true }); 
    document.addEventListener('contextmenu', e => e.preventDefault());
</script>
